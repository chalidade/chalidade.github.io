concept_contract: source/concept-contract.yaml
identity_bible: null
parameter_space: linear
media_access: sequential
gesture_policy:
  unit: one-gesture-one-step
  inertia: coalesce
  while_active: retarget     # leaving mid-wave reverses it; click retargets to the intro
  boundary: loop             # after the intro (rest pose) the player re-seats on frame 0
  programmatic_navigation: ignore
storyboard: [rest, point + wave, rest, open hands, point at self, thumbs up, rest]
keyframes: {K0: source frame 0, K1: source frame 92, K2: source frame 211}
clip_chain: [wave K0->K1 (0..92), intro K1->K2 (93..211)]
rest_state: rest (frame 0)
loop: open
anchor: bottom
scene_continuity: null
frame_policy: native
target_fps: 24
quality_target: 480x800 desktop, 360x600 mobile, CRF from compiler defaults
pixel_dimensions: 720x1200 master
reduced_motion: static alpha poster of frame 0
source_media: user-supplied gemini_generated_video_25b8a622.mp4 (720x1280, 24fps, 240 frames); white background removed by tools/matte.py (border flood fill, shadow to black alpha)
