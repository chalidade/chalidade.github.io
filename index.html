<!doctype html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>weeknoo</title>
  <meta http-equiv="refresh" content="0; url=/weeknoo/">
  <link rel="canonical" href="https://chalidade.github.io/weeknoo/">
  <script>
    // Teruskan path, query & hash: /foo?x#y → /weeknoo/foo?x#y
    var p = location.pathname.replace(/^\/+/, "");
    location.replace("/weeknoo/" + p + location.search + location.hash);
  </script>
</head>
