<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#09090b;color:#fafafa;font-family:Geist,sans-serif;padding:80px 88px;position:relative}
body::before{content:"";position:absolute;inset:0;background:
 radial-gradient(600px 400px at 100% 0%,rgba(96,165,250,.28),transparent 70%),
 radial-gradient(500px 360px at 85% 100%,rgba(139,92,246,.22),transparent 70%)}
body::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(90deg,transparent,#000 60%)}
.c{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.pill{display:inline-flex;align-items:center;gap:10px;font-size:22px;color:#a1a1aa;border:1px solid #27272a;background:#111113;border-radius:999px;padding:8px 20px 8px 16px;align-self:flex-start}
.pill i{width:12px;height:12px;border-radius:50%;background:#22c55e}
h1{font-size:92px;font-weight:600;letter-spacing:-.035em;line-height:1.02;margin-top:48px}
h2{font-size:64px;font-weight:600;letter-spacing:-.03em;line-height:1.05;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;color:transparent}
.stack{margin-top:auto;display:flex;justify-content:space-between;align-items:end;font-family:"Geist Mono",monospace;font-size:24px;color:#a1a1aa}
.stack b{color:#fafafa;font-weight:500}
</style></head><body><div class="c">
<div class="pill"><i></i>Remote · East Java, Indonesia (GMT+7)</div>
<h1>Chalid Ade Rahman</h1>
<h2>Senior Frontend Engineer</h2>
<div class="stack"><span>React · Next.js · TypeScript · 8+ yrs</span><b>chalidade.github.io</b></div>
</div></body></html>
